<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Your Booking - TravelIntel AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        :root {
            --bg-dark: #0f172a;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
        }
        html { font-size: clamp(14px, 1vw, 18px); }
        body {
            background-color: var(--bg-dark);
            color: #f8fafc;
            background-image: radial-gradient(circle at top right, rgba(37, 99, 235, 0.05), transparent),
                              radial-gradient(circle at bottom left, rgba(29, 78, 216, 0.05), transparent);
        }
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
        }
        .nav-logo {
            width: clamp(1.75rem, 3.5vw, 2rem);
            height: clamp(1.75rem, 3.5vw, 2rem);
        }
        .navbar-h { height: clamp(3.5rem, 6vw, 5rem); }
        .btn-px { padding-left: clamp(1.5rem, 4vw, 2.5rem); padding-right: clamp(1.5rem, 4vw, 2.5rem); }
        .btn-py { padding-top: clamp(0.75rem, 1.5vw, 1.25rem); padding-bottom: clamp(0.75rem, 1.5vw, 1.25rem); }
        .input-px { padding-left: clamp(1rem, 2vw, 1.25rem); padding-right: clamp(1rem, 2vw, 1.25rem); }
        .input-py { padding-top: clamp(0.75rem, 1.5vw, 1rem); padding-bottom: clamp(0.75rem, 1.5vw, 1rem); }
        .card-round { border-radius: clamp(1.25rem, 3vw, 2.5rem); }
        .section-padding { padding: clamp(1.5rem, 4vw, 3rem); }
        .card-padding-sm { padding: clamp(1rem, 2.5vw, 2rem); }
        .form-gap { gap: clamp(0.75rem, 2vw, 1.5rem); }
        .gap-section { gap: clamp(1rem, 3vw, 2.5rem); }
        .page-title { font-size: clamp(1.5rem, 4vw, 2.5rem); }
        .pkg-name { font-size: clamp(1.25rem, 3vw, 1.875rem); }
        .pkg-img-h { height: clamp(10rem, 28vw, 16rem); }
        .price-size { font-size: clamp(1.5rem, 4vw, 1.875rem); }
        .hero-pad { padding-top: clamp(6rem, 14vw, 8rem); padding-bottom: clamp(3rem, 8vw, 5rem); }
        @media (max-width: 767px) {
            .mobile-menu {
                display: none;
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                background: rgba(15, 23, 42, 0.98);
                backdrop-filter: blur(20px);
                padding: 1rem 1.5rem;
                border-bottom: 1px solid var(--glass-border);
                flex-direction: column;
                align-items: stretch;
                gap: 0.75rem;
            }
            .mobile-menu.open { display: flex; }
            .mobile-menu > * { width: 100%; text-align: center; }
            .hamburger { display: flex; }
        }
        @media (min-width: 768px) {
            .hamburger { display: none; }
            .mobile-menu { display: flex !important; }
        }
    </style>
</head>
<body class="font-sans min-h-screen pb-20">
    <nav class="glass fixed w-full z-50 top-0">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative">
            <div class="flex justify-between navbar-h items-center">
                <a href="/home" class="flex items-center space-x-2">
                    <div class="nav-logo bg-blue-600 rounded-lg flex items-center justify-center">
                        <i class="fas fa-robot text-white"></i>
                    </div>
                    <span class="text-[clamp(0.9rem,2vw,1.25rem)] font-black text-white">TravelIntel AI</span>
                </a>
                <button class="hamburger w-10 h-10 items-center justify-center text-white rounded-lg hover:bg-white/5 transition" onclick="toggleMobileMenu()" aria-label="Menu">
                    <i class="fas fa-bars text-lg"></i>
                </button>
                <div id="nav-auth" class="mobile-menu flex items-center space-x-0 md:space-x-6">
                    <!-- Auth links will be injected here -->
                </div>
            </div>
        </div>
    </nav>

    <!-- Flash banner host for in-page transient errors/warnings -->
    <div id="booking-flash" class="fixed top-[clamp(4rem,7vw,5.5rem)] left-1/2 -translate-x-1/2 z-[60] w-[min(92%,720px)] hidden"></div>

    <main class="max-w-7xl mx-auto hero-pad px-4 pb-[clamp(3rem,8vw,5rem)]">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-section">
            <!-- Left: Package Details -->
            <div class="lg:col-span-1">
                <div class="glass card-round overflow-hidden lg:sticky lg:top-[clamp(4rem,10vw,6rem)]">
                    <div class="pkg-img-h relative">
                        <img id="pkg-image" src="" alt="" class="w-full h-full object-cover">
                        <div class="absolute inset-0 bg-gradient-to-t from-[#0a0f1d] to-transparent"></div>
                        <div id="pkg-status" class="absolute top-[clamp(0.75rem,3vw,1.5rem)] left-[clamp(0.75rem,3vw,1.5rem)] px-[clamp(0.5rem,1.5vw,0.75rem)] py-[clamp(0.2rem,0.8vw,0.3rem)] rounded-full text-[clamp(0.5rem,1.1vw,0.625rem)] font-black uppercase tracking-widest border border-current"></div>
                    </div>
                    <div class="card-padding-sm">
                        <h2 id="pkg-name" class="pkg-name font-black text-white mb-[clamp(0.25rem,1vw,0.5rem)]"></h2>
                        <p id="pkg-destination" class="text-blue-500 font-bold uppercase tracking-widest text-[clamp(0.65rem,1.3vw,0.875rem)] mb-[clamp(1rem,3vw,1.5rem)]"></p>
                        <p id="pkg-description" class="text-gray-400 text-[clamp(0.7rem,1.3vw,0.875rem)] leading-relaxed mb-[clamp(1rem,3vw,2rem)]"></p>
                        <div class="flex items-center space-x-[clamp(0.75rem,2vw,1rem)] text-white font-bold text-[clamp(0.7rem,1.3vw,0.875rem)] flex-wrap gap-2 mb-[clamp(1rem,3vw,1.5rem)]">
                            <div class="glass px-[clamp(0.75rem,2vw,1rem)] py-[clamp(0.4rem,1vw,0.5rem)] rounded-xl flex items-center">
                                <i class="far fa-clock mr-2 text-blue-400"></i>
                                <span id="pkg-duration"></span>
                            </div>
                        </div>
                        <div id="pkg-price-block"></div>
                    </div>
                </div>
            </div>

            <!-- Right: Booking Form -->
            <div class="lg:col-span-2">
                <div class="glass section-padding card-round">
                    <h1 class="page-title font-black text-white mb-[clamp(0.25rem,1vw,0.5rem)]">Complete Booking</h1>
                    <p class="text-gray-400 mb-[clamp(1.5rem,5vw,2.5rem)] text-[clamp(0.75rem,1.3vw,0.9rem)]">Please review and complete your information to finalize your journey.</p>

            <form id="booking-details-form" class="space-y-[clamp(1.5rem,4vw,2rem)]">
                <div class="grid grid-cols-1 md:grid-cols-2 form-gap">
                    <div>
                        <label class="block text-[clamp(0.7rem,1.3vw,0.875rem)] font-bold text-gray-400 mb-[clamp(0.35rem,1vw,0.5rem)] ml-1">Full Name</label>
                        <input type="text" id="full-name" class="w-full input-px input-py bg-white/5 border border-white/10 rounded-2xl focus:ring-2 focus:ring-blue-500 transition outline-none text-white" placeholder="e.g., Alexander Hamilton" required>
                    </div>
                    <div>
                        <label class="block text-[clamp(0.7rem,1.3vw,0.875rem)] font-bold text-gray-400 mb-[clamp(0.35rem,1vw,0.5rem)] ml-1">Email Address</label>
                        <input type="email" id="email" class="w-full input-px input-py bg-white/5 border border-white/10 rounded-2xl focus:ring-2 focus:ring-blue-500 transition outline-none text-white" placeholder="alexander@travelintel.ai" required>
                    </div>
                    <div>
                        <label class="block text-[clamp(0.7rem,1.3vw,0.875rem)] font-bold text-gray-400 mb-[clamp(0.35rem,1vw,0.5rem)] ml-1">Contact Number</label>
                        <input type="tel" id="phone" class="w-full input-px input-py bg-white/5 border border-white/10 rounded-2xl focus:ring-2 focus:ring-blue-500 transition outline-none text-white" placeholder="+27 82 000 0000" required>
                    </div>
                    <div>
                        <label class="block text-[clamp(0.7rem,1.3vw,0.875rem)] font-bold text-gray-400 mb-[clamp(0.35rem,1vw,0.5rem)] ml-1">Preferred Travel Date</label>
                        <input type="date" id="travel-date" class="w-full input-px input-py bg-white/5 border border-white/10 rounded-2xl focus:ring-2 focus:ring-blue-500 transition outline-none text-white" style="color-scheme: dark;" required>
                    </div>
                    <div>
                        <label class="block text-[clamp(0.7rem,1.3vw,0.875rem)] font-bold text-gray-400 mb-[clamp(0.35rem,1vw,0.5rem)] ml-1">Traveler Count</label>
                        <input type="number" id="travelers" min="1" max="10" value="1" class="w-full input-px input-py bg-white/5 border border-white/10 rounded-2xl focus:ring-2 focus:ring-blue-500 transition outline-none text-white" required onchange="updateTotalPrice()">
                        <p id="traveler-limit-msg" class="hidden text-[clamp(0.6rem,1.1vw,0.75rem)] font-bold text-red-400 mt-2"></p>
                    </div>
                </div>

                <div>
                    <label class="block text-[clamp(0.7rem,1.3vw,0.875rem)] font-bold text-gray-400 mb-[clamp(0.35rem,1vw,0.5rem)] ml-1">Residential Address</label>
                    <textarea id="address" rows="3" class="w-full input-px input-py bg-white/5 border border-white/10 rounded-2xl focus:ring-2 focus:ring-blue-500 transition outline-none text-white" placeholder="Street name, Suburb, City, Postal Code" required></textarea>
                </div>

                <div>
                    <label class="block text-[clamp(0.7rem,1.3vw,0.875rem)] font-bold text-gray-400 mb-[clamp(0.35rem,1vw,0.5rem)] ml-1">Payment Method</label>
                    <div class="grid grid-cols-1 sm:grid-cols-2 form-gap mb-[clamp(1rem,3vw,1.5rem)]">
                        <label class="relative glass section-padding-sm p-4 rounded-2xl cursor-pointer flex items-center space-x-4 border-2 border-transparent hover:border-blue-500 transition has-[:checked]:border-blue-500 has-[:checked]:bg-blue-600/10">
                            <input type="radio" name="payment" value="credit_card" class="hidden" onchange="togglePaymentFields(this.value)">
                            <i class="fas fa-credit-card text-blue-400 text-[clamp(1rem,2vw,1.25rem)]"></i>
                            <span class="text-white font-bold text-[clamp(0.75rem,1.3vw,0.9rem)]">Credit / Debit Card</span>
                        </label>
                        <label class="relative glass p-4 rounded-2xl cursor-pointer flex items-center space-x-4 border-2 border-transparent hover:border-blue-500 transition has-[:checked]:border-blue-500 has-[:checked]:bg-blue-600/10">
                            <input type="radio" name="payment" value="eft" class="hidden" onchange="togglePaymentFields(this.value)">
                            <i class="fas fa-university text-blue-400 text-[clamp(1rem,2vw,1.25rem)]"></i>
                            <span class="text-white font-bold text-[clamp(0.75rem,1.3vw,0.9rem)]">EFT Transfer</span>
                        </label>
                    </div>

                    <!-- Card Details -->
                    <div id="card-details" class="payment-fields hidden space-y-4 mb-[clamp(1rem,3vw,1.5rem)] animate-in fade-in duration-300">
                        <div>
                            <label class="block text-[clamp(0.6rem,1.1vw,0.75rem)] font-bold text-gray-500 mb-[clamp(0.25rem,0.8vw,0.5rem)] ml-1">Card Number</label>
                            <input type="text" id="card-number" inputmode="numeric" autocomplete="cc-number" maxlength="23" class="w-full input-px py-[clamp(0.5rem,1.2vw,0.75rem)] bg-white/5 border border-white/10 rounded-2xl focus:ring-2 focus:ring-blue-500 transition outline-none text-white text-[clamp(0.7rem,1.3vw,0.875rem)]" placeholder="XXXX XXXX XXXX XXXX">
                            <p id="card-number-msg" class="text-[clamp(0.6rem,1.1vw,0.75rem)] mt-2 font-bold hidden"></p>
                        </div>
                        <div class="grid grid-cols-2 form-gap">
                            <div>
                                <label class="block text-[clamp(0.6rem,1.1vw,0.75rem)] font-bold text-gray-500 mb-[clamp(0.25rem,0.8vw,0.5rem)] ml-1">Expiry Date</label>
                                <input type="text" id="card-expiry" inputmode="numeric" autocomplete="cc-exp" maxlength="5" class="w-full input-px py-[clamp(0.5rem,1.2vw,0.75rem)] bg-white/5 border border-white/10 rounded-2xl focus:ring-2 focus:ring-blue-500 transition outline-none text-white text-[clamp(0.7rem,1.3vw,0.875rem)]" placeholder="MM/YY">
                                <p id="card-expiry-msg" class="text-[clamp(0.6rem,1.1vw,0.75rem)] mt-2 font-bold hidden"></p>
                            </div>
                            <div>
                                <label class="block text-[clamp(0.6rem,1.1vw,0.75rem)] font-bold text-gray-500 mb-[clamp(0.25rem,0.8vw,0.5rem)] ml-1">CVV</label>
                                <input type="password" id="card-cvv" inputmode="numeric" autocomplete="cc-csc" maxlength="4" class="w-full input-px py-[clamp(0.5rem,1.2vw,0.75rem)] bg-white/5 border border-white/10 rounded-2xl focus:ring-2 focus:ring-blue-500 transition outline-none text-white text-[clamp(0.7rem,1.3vw,0.875rem)]" placeholder="***">
                                <p id="card-cvv-msg" class="text-[clamp(0.6rem,1.1vw,0.75rem)] mt-2 font-bold hidden"></p>
                            </div>
                        </div>
                    </div>

                    <!-- EFT Details -->
                    <div id="eft-details" class="payment-fields hidden space-y-4 mb-[clamp(1rem,3vw,1.5rem)] animate-in fade-in duration-300">
                        <div>
                            <label class="block text-[clamp(0.6rem,1.1vw,0.75rem)] font-bold text-gray-500 mb-[clamp(0.25rem,0.8vw,0.5rem)] ml-1">Bank Name</label>
                            <select id="bank-name" class="w-full input-px py-[clamp(0.5rem,1.2vw,0.75rem)] bg-white/5 border border-white/10 rounded-2xl focus:ring-2 focus:ring-blue-500 transition outline-none text-white text-[clamp(0.7rem,1.3vw,0.875rem)]">
                                <option value="" class="bg-slate-800 text-white">-- Select your bank --</option>
                                <option value="Absa Bank" class="bg-slate-800 text-white">Absa Bank</option>
                                <option value="Standard Bank" class="bg-slate-800 text-white">Standard Bank</option>
                                <option value="FNB" class="bg-slate-800 text-white">FNB (First National Bank)</option>
                                <option value="Nedbank" class="bg-slate-800 text-white">Nedbank</option>
                                <option value="Capitec Bank" class="bg-slate-800 text-white">Capitec Bank</option>
                                <option value="TymeBank" class="bg-slate-800 text-white">TymeBank</option>
                                <option value="Discovery Bank" class="bg-slate-800 text-white">Discovery Bank</option>
                                <option value="Investec Bank" class="bg-slate-800 text-white">Investec Bank</option>
                                <option value="Bidvest Bank" class="bg-slate-800 text-white">Bidvest Bank</option>
                                <option value="Sasfin Bank" class="bg-slate-800 text-white">Sasfin Bank</option>
                                <option value="Albaraka Bank" class="bg-slate-800 text-white">Albaraka Bank</option>
                                <option value="African Bank" class="bg-slate-800 text-white">African Bank</option>
                                <option value="Old Mutual Bank" class="bg-slate-800 text-white">Old Mutual Bank</option>
                                <option value="Grindrod Bank" class="bg-slate-800 text-white">Grindrod Bank</option>
                                <option value="Mercantile Bank" class="bg-slate-800 text-white">Mercantile Bank</option>
                            </select>
                            <p id="bank-name-msg" class="text-[clamp(0.6rem,1.1vw,0.75rem)] mt-2 font-bold hidden"></p>
                        </div>
                        <div>
                            <label class="block text-[clamp(0.6rem,1.1vw,0.75rem)] font-bold text-gray-500 mb-[clamp(0.25rem,0.8vw,0.5rem)] ml-1">Account Number</label>
                            <input type="text" id="account-number" inputmode="numeric" maxlength="18" class="w-full input-px py-[clamp(0.5rem,1.2vw,0.75rem)] bg-white/5 border border-white/10 rounded-2xl focus:ring-2 focus:ring-blue-500 transition outline-none text-white text-[clamp(0.7rem,1.3vw,0.875rem)]" placeholder="Only digits, e.g. 1234567890">
                            <p id="account-number-msg" class="text-[clamp(0.6rem,1.1vw,0.75rem)] mt-2 font-bold hidden"></p>
                            <p id="account-hint" class="text-[clamp(0.55rem,1vw,0.7rem)] mt-1 text-gray-500 italic hidden"></p>
                            <p class="text-[clamp(0.55rem,1vw,0.7rem)] mt-1 text-gray-600 italic">
                                Note: We validate the account number format for your bank. We cannot verify that the account actually belongs to you — please double-check your details.
                            </p>
                        </div>
                    </div>
                </div>

                <div class="pt-6 border-t border-white/5">
                    <div id="price-breakdown" class="mb-[clamp(1rem,3vw,2rem)] text-sm hidden"></div>
                    <div class="flex items-center justify-between mb-[clamp(1rem,3vw,2rem)] flex-col sm:flex-row gap-4 sm:gap-0">
                        <div class="text-center sm:text-left">
                            <p class="text-gray-500 text-[clamp(0.65rem,1.2vw,0.875rem)] font-bold uppercase tracking-wider">Total Price</p>
                            <h3 class="price-size font-black text-blue-500" id="total-price-display" style="font-family: 'Inter', sans-serif;">--</h3>
                        </div>
                        <button type="submit" id="submit-booking-btn" class="bg-blue-600 text-white btn-px btn-py rounded-2xl font-black text-[clamp(0.8rem,1.5vw,1.125rem)] hover:bg-blue-700 transition shadow-2xl shadow-blue-600/30 w-full sm:w-auto">
                            Confirm Booking <i class="fas fa-arrow-right ml-2"></i>
                        </button>
                    </div>
                </div>
            </form>
                </div>
            </div>
        </div>
    </main>

    <script src="/static/js/main.js"></script>
    <script src="/static/js/package-images.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const packageId = params.get('packageId');
        const submitBtn = document.getElementById('submit-booking-btn');

        function redirectHome(errorCode) {
            const url = new URL('/home', window.location.origin);
            if (errorCode) url.searchParams.set('error', errorCode);
            window.location.replace(url.toString());
        }
        function showBookingFlash(kind, title, message, actions, ms) {
            const host = document.getElementById('booking-flash');
            if (!host) return;
            const k = kind === 'success' ? 'success' : kind === 'info' ? 'info' : 'error';
            const palette = {
                error:   { tint:'border-amber-500/30 bg-amber-500/10 text-amber-200',  icon:'fa-triangle-exclamation', iconTint:'text-amber-400',   btn:'bg-amber-500/20 hover:bg-amber-500/30 text-amber-100 border-amber-400/30' },
                success: { tint:'border-emerald-500/30 bg-emerald-500/10 text-emerald-200', icon:'fa-circle-check',       iconTint:'text-emerald-400', btn:'bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-100 border-emerald-400/30' },
                info:    { tint:'border-sky-500/30 bg-sky-500/10 text-sky-200',           icon:'fa-circle-info',        iconTint:'text-sky-400',     btn:'bg-sky-500/20 hover:bg-sky-500/30 text-sky-100 border-sky-400/30' }
            }[k];
            const buttons = Array.isArray(actions) && actions.length
                ? `<div class="mt-3 flex flex-wrap gap-2">${actions.map(a => {
                    const as = a.type === 'primary'
                        ? 'bg-white/90 text-slate-900 hover:bg-white border border-white/60'
                        : palette.btn;
                    return `<button type="button" class="px-3 py-1.5 rounded-xl border text-xs font-black transition ${as}" ${a.href ? `onclick="window.location.href='${a.href.replace(/'/g,"\\'")}'"` : ''} ${a.onclick ? `onclick="${String(a.onclick).replace(/"/g,'&quot;')}"` : ''}>
                        ${a.icon ? `<i class="fas ${a.icon} mr-1"></i>` : ''}${a.label}</button>`;
                }).join('')}</div>`
                : '';
            host.innerHTML = `
                <div class="animate__animated animate__fadeInDown glass ${palette.tint} rounded-2xl px-5 py-4 border shadow-2xl backdrop-blur-xl flex items-start gap-4">
                    <i class="fas ${palette.icon} ${palette.iconTint} text-xl mt-0.5 shrink-0"></i>
                    <div class="flex-1 min-w-0">
                        <div class="font-black text-white text-sm md:text-base">${title}</div>
                        <div class="mt-1 text-xs md:text-sm opacity-95 leading-relaxed">${message}</div>
                        ${buttons}
                    </div>
                    <button type="button" onclick="document.getElementById('booking-flash').classList.add('hidden')"
                            class="shrink-0 px-3 py-1.5 rounded-xl border text-xs font-black transition ${palette.btn}">
                        <i class="fas fa-times"></i>
                    </button>
                </div>`;
            host.classList.remove('hidden');
            const t = typeof ms === 'number' ? ms : 18000;
            if (t > 0) setTimeout(() => host.classList.add('hidden'), t);
        }

        function togglePaymentFields(method) {
            document.querySelectorAll('.payment-fields').forEach(el => el.classList.add('hidden'));
            if (method === 'credit_card') {
                document.getElementById('card-details').classList.remove('hidden');
            } else if (method === 'eft') {
                document.getElementById('eft-details').classList.remove('hidden');
            }
        }
        
        let basePrice = 0;
        let originalPrice = 0;
        let discountPct = 0;
        let discountStartDate = null;
        let discountEndDate = null;
        let increasePct = 0;
        let increaseStartDate = null;
        let increaseEndDate = null;
        let maxTravelers = 10;

        function _parseISO(s) {
            if (!s) return null;
            const d = new Date(s + 'T00:00:00');
            return isNaN(d.getTime()) ? null : d;
        }
        function _fmtRange(startStr, endStr) {
            const opts = { month: 'short', day: '2-digit', year: 'numeric' };
            const s = _parseISO(startStr);
            const e = _parseISO(endStr);
            if (!s || !e) return '';
            if (s.getTime() === e.getTime()) {
                const today = new Date(); today.setHours(0,0,0,0);
                if (s.getTime() === today.getTime()) {
                    return 'Today Only';
                }
                const on = s.toLocaleDateString(undefined, opts).replace(',', '');
                return `on ${on} only`;
            }
            return s.toLocaleDateString(undefined, opts).replace(',', '') + ' – ' + e.toLocaleDateString(undefined, opts).replace(',', '');
        }
        function effectiveIncreaseToday() {
            const pct = Math.max(0, Math.min(100, parseInt(increasePct || 0, 10)));
            if (pct <= 0) return 0;
            const start = increaseStartDate;
            const end = increaseEndDate;
            if (!start || !end) return pct;
            const s = _parseISO(start);
            const e = _parseISO(end);
            if (!s || !e) return pct;
            const today = new Date(); today.setHours(0,0,0,0);
            if (today > e) return 0;
            return (today >= s && today <= e) ? pct : 0;
        }
        function effectiveDiscountFor(travelDateStr) {
            const pct = Math.max(0, Math.min(100, parseInt(discountPct || 0, 10)));
            if (pct <= 0) return { appliedPct: 0, status: 'none', reason: null, windowText: null };
            const start = discountStartDate;
            const end = discountEndDate;
            if (!start || !end) return { appliedPct: pct, status: 'legacy', reason: null, windowText: null };
            const s = _parseISO(start);
            const e = _parseISO(end);
            if (!s || !e) return { appliedPct: pct, status: 'legacy', reason: null, windowText: null };
            const travel = _parseISO(travelDateStr);
            if (!travel) return { appliedPct: 0, status: 'upcoming-or-expired', reason: `Discount valid ${_fmtRange(start, end)}. Pick a travel date within the window to unlock it.`, windowText: _fmtRange(start, end) };
            const today = new Date(); today.setHours(0,0,0,0);
            if (travel >= s && travel <= e) {
                return { appliedPct: pct, status: 'active-travel', reason: null, windowText: _fmtRange(start, end) };
            }
            if (today < s) {
                return { appliedPct: 0, status: 'upcoming', reason: `Discount valid starting ${_fmtRange(start,end).split(' – ')[0]}. Book a travel date within the window to unlock it.`, windowText: _fmtRange(start, end) };
            }
            if (today > e) {
                return { appliedPct: 0, status: 'expired', reason: null, windowText: null };
            }
            return { appliedPct: 0, status: 'window-outside', reason: `Discount valid ${_fmtRange(start, end)}. Adjust your travel date to fall inside that window.`, windowText: _fmtRange(start, end) };
        }

        function isValidCardNumber(value) {
            const digits = String(value || '').replace(/\D/g, '');
            if (digits.length < 12 || digits.length > 19) return false;
            const obviousFakes = [
                '0000000000000','1234567890123','0123456789012',
                '0000000000000000','1111111111111111','2222222222222222',
                '3333333333333333','4444444444444444','5555555555555555',
                '6666666666666666','7777777777777777','8888888888888888',
                '9999999999999999','1234567890123456','1234123412341234',
                '4111111111111111','4242424242424242','5555555555554444',
                '5105105105105100','378282246310005','371449635398431',
            ];
            if (obviousFakes.includes(digits)) return false;
            let sum = 0;
            const parity = digits.length % 2;
            for (let i = 0; i < digits.length; i++) {
                let digit = Number(digits[i]);
                if (i % 2 === parity) { digit *= 2; if (digit > 9) digit -= 9; }
                sum += digit;
            }
            return sum % 10 === 0;
        }

        function cardBrand(value) {
            const digits = String(value || '').replace(/\D/g, '');
            if (/^4[0-9]{12}(?:[0-9]{3})?$/.test(digits)) return 'Visa';
            if (/^(?:5[1-5][0-9]{2}|222[1-9]|22[3-9][0-9]|2[3-6][0-9]{2}|27[01][0-9]|2720)[0-9]{12}$/.test(digits)) return 'Mastercard';
            if (/^3[47][0-9]{13}$/.test(digits)) return 'American Express';
            if (/^6(?:011|5[0-9]{2})[0-9]{12,}$/.test(digits)) return 'Discover';
            return 'Card';
        }

        function isValidCardCVV(value, cardNumber) {
            const digits = String(value || '').replace(/\D/g, '');
            if (!digits) return false;
            if (digits.length < 3 || digits.length > 4) return false;
            if (new Set(digits).size === 1) return false;
            if (cardNumber) {
                const brand = cardBrand(cardNumber);
                if (brand === 'American Express') return digits.length === 4;
                if (brand === 'Visa' || brand === 'Mastercard' || brand === 'Discover') return digits.length === 3;
            }
            return true;
        }

        function isValidExpiry(value) {
            const m = String(value || '').match(/^(0[1-9]|1[0-2])\/(\d{2})$/);
            if (!m) return false;
            const now = new Date();
            const expiry = new Date(2000 + Number(m[2]), Number(m[1]), 0, 23, 59, 59);
            return expiry >= now;
        }

        const SA_BANK_RULES = {
            'Absa Bank':         { min: 7,  max: 10, label: 'Absa Bank account numbers are 7-10 digits.' },
            'Standard Bank':     { min: 8,  max: 11, label: 'Standard Bank account numbers are 8-11 digits.' },
            'FNB':               { min: 8,  max: 10, label: 'FNB account numbers are 8-10 digits.' },
            'Nedbank':           { min: 8,  max: 11, label: 'Nedbank account numbers are 8-11 digits.' },
            'Capitec Bank':      { min: 12, max: 16, label: 'Capitec Bank account numbers are 12-16 digits (typically 14).' },
            'TymeBank':          { min: 11, max: 13, label: 'TymeBank account numbers are 11-13 digits (typically 12).' },
            'Discovery Bank':    { min: 9,  max: 11, label: 'Discovery Bank account numbers are 9-11 digits.' },
            'Investec Bank':     { min: 8,  max: 10, label: 'Investec Bank account numbers are 8-10 digits.' },
            'Bidvest Bank':      { min: 8,  max: 11, label: 'Bidvest Bank account numbers are 8-11 digits.' },
            'Sasfin Bank':       { min: 8,  max: 10, label: 'Sasfin Bank account numbers are 8-10 digits.' },
            'Albaraka Bank':     { min: 8,  max: 10, label: 'Albaraka Bank account numbers are 8-10 digits.' },
            'African Bank':      { min: 9,  max: 11, label: 'African Bank account numbers are 9-11 digits.' },
            'Old Mutual Bank':   { min: 8,  max: 10, label: 'Old Mutual Bank account numbers are 8-10 digits.' },
            'Grindrod Bank':     { min: 8,  max: 10, label: 'Grindrod Bank account numbers are 8-10 digits.' },
            'Mercantile Bank':   { min: 8,  max: 10, label: 'Mercantile Bank account numbers are 8-10 digits.' },
        };

        function isValidBankName(value) {
            const v = (value || '').trim();
            if (!v) return false;
            return Object.prototype.hasOwnProperty.call(SA_BANK_RULES, v);
        }

        function isValidAccountNumber(value, bankName) {
            const raw = (value || '').trim();
            if (!raw) return false;
            const digits = raw.replace(/\D/g, '');
            if (!digits) return false;
            if (digits.length < 6 || digits.length > 18) return false;
            if (new Set(digits).size === 1) return false;
            let ascending = true, descending = true;
            for (let i = 1; i < digits.length; i++) {
                if (digits[i] < digits[i-1]) ascending = false;
                if (digits[i] > digits[i-1]) descending = false;
            }
            if (digits.length >= 5 && (ascending || descending)) return false;
            const bank = (bankName || '').trim();
            if (bank && SA_BANK_RULES[bank]) {
                const rule = SA_BANK_RULES[bank];
                if (digits.length < rule.min || digits.length > rule.max) return false;
            }
            return true;
        }

        function setFieldValidation(id, valid, message) {

                if (valid === true) msg.classList.add('text-green-400');
                else if (valid === false) msg.classList.add('text-red-400');
                else msg.classList.add('hidden');
            }
            return valid;
        }

                const expiry = document.getElementById('card-expiry').value.trim();
                if (!isValidExpiry(expiry)) {
                    setFieldValidation('card-expiry', false, 'Enter a valid, non-expired MM/YY date.');
                    document.getElementById('card-expiry').focus();
                    return;
                }
                const cvv = document.getElementById('card-cvv').value.trim();
                if (!isValidCardCVV(cvv, cardNumber)) {
                    setFieldValidation('card-cvv', false, 'Please enter a valid CVV (3-4 digits on the back of your card).');
                    document.getElementById('card-cvv').focus();
                    return;
                }
            } else if (paymentMethod === 'eft') {
                if (!isValidBankName(bankName)) {
                    setFieldValidation('bank-name', false, 'Please select a valid South African bank from the dropdown list.');
                    document.getElementById('bank-name').focus();
                    return;
                }
                if (!isValidAccountNumber(accountNumber, bankName)) {
                    let msg = 'Please enter a valid bank account number (no test sequences).';
                    if (bankName && SA_BANK_RULES[bankName]) {
                        const rule = SA_BANK_RULES[bankName];
                        const dlen = accountNumber.replace(/\D/g, '').length;
                        if (dlen < rule.min || dlen > rule.max) {
                            msg = `Invalid length for ${bankName}: entered ${dlen} digits. ${rule.label}`;
                        }
                    }
                    setFieldValidation('account-number', false, msg);
                    document.getElementById('account-number').focus();
                    return;
                }
            }

            const formData = {
                package_id: parseInt(packageId),
                name: document.getElementById('full-name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                travel_date: document.getElementById('travel-date').value,
                number_of_travelers: travelerCount,
                payment_method: paymentMethod,
                address: document.getElementById('address').value,
                card_number: document.getElementById('card-number').value,
                card_expiry: document.getElementById('card-expiry').value,
                bank_name: bankName,
                account_number: accountNumber
            };

            submitBtn.disabled = true;
            submitBtn.textContent = 'Processing...';

            try {
                const res = await fetch('/bookings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });
                const data = await res.json();
                if (data.success) {
                    // Update local storage user info if logged in
                    const userStr = localStorage.getItem('user');
                    if (userStr) {
                        const user = JSON.parse(userStr);
                        user.full_name = formData.name;
                        localStorage.setItem('user', JSON.stringify(user));
                    }

                    // Add a small delay to ensure DB write is finalized before redirection
                    setTimeout(() => {
                        window.location.href = `/confirmation?bookingId=${data.data.booking_id}`;
                    }, 500);
                } else {
                    const serverMsg = String(data.detail || data.error || data.message || 'Booking failed. Please try again.');
                    let hint = serverMsg;
                    let code = null;
                    if (/package.*not.*found|no.*package|invalid.*package/i.test(serverMsg)) code = 'package_404';
                    else if (/unavailable|fully.*booked|not.*enough.*spot|sold.?out/i.test(serverMsg)) code = 'package_unavailable';
                    else if (/past|travel.?date|invalid.*date/i.test(serverMsg)) code = 'bad_date';
                    if (code) {
                        redirectHome(code);
                        return;
                    }
                    showBookingFlash(
                        'error',
                        'Booking could not be completed',
                        hint,
                        [
                            { label: 'Try again', icon: 'fa-rotate-right', type: 'primary',
                              onclick: "document.getElementById('booking-flash').classList.add('hidden');" },
                            { label: 'Pick another package', icon: 'fa-compass', href: '/home#packages' }
                        ],
                        20000
                    );
                }
            } catch (err) {
                showBookingFlash(
                    'error',
                    'Your connection dropped',
                    'We did not receive a response from the server. Your card was NOT charged. Please check your internet connection and try again.',
                    [
                        { label: 'Retry booking', icon: 'fa-rotate-right', type: 'primary',
                          onclick: "document.getElementById('booking-flash').classList.add('hidden');" +
                                   "document.getElementById('submit-booking-btn').click();" },
                        { label: 'Browse packages', icon: 'fa-compass', href: '/home#packages' }
                    ],
                    0
                );
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Confirm Booking';
            }
        });
        function toggleMobileMenu() {
            const menu = document.getElementById('nav-auth');
            if (menu) menu.classList.toggle('open');
        }
    </script>
</body>
</html>
