<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - TravelIntel AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0f172a;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
        }
        html { font-size: clamp(14px, 1vw, 18px); }
        body {
            background-color: var(--bg-dark);
            color: #f8fafc;
            background-image:
                radial-gradient(circle at top right, rgba(37, 99, 235, 0.05), transparent),
                radial-gradient(circle at bottom left, rgba(29, 78, 216, 0.05), transparent);
        }
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
        }
        .card-padding { padding: clamp(1.5rem, 5vw, 2.5rem); }
        .card-round { border-radius: clamp(1.5rem, 4vw, 2.5rem); }
        .eyebrow-text { font-size: clamp(0.55rem, 1.1vw, 0.75rem); }
        .header-title { font-size: clamp(1.5rem, 4vw, 2rem); }
        .header-subtitle { font-size: clamp(0.7rem, 1.3vw, 0.9rem); }
        .mt-eyebrow { margin-top: clamp(0.35rem, 1vw, 0.5rem); }
        .mt-subtitle { margin-top: clamp(0.6rem, 1.8vw, 0.875rem); }
        .mt-form { margin-top: clamp(1.25rem, 4vw, 1.75rem); }
        .form-space { space-y: clamp(0.85rem, 2.5vw, 1.25rem); }
        .input-px { padding-left: clamp(0.75rem, 2vw, 1rem); padding-right: clamp(0.75rem, 2vw, 1rem); }
        .input-py { padding-top: clamp(0.7rem, 1.5vw, 0.85rem); padding-bottom: clamp(0.7rem, 1.5vw, 0.85rem); }
        .btn-py { padding-top: clamp(0.7rem, 1.5vw, 0.85rem); padding-bottom: clamp(0.7rem, 1.5vw, 0.85rem); }
        .btn-text { font-size: clamp(0.875rem, 1.5vw, 1.125rem); }
        .input-round { border-radius: clamp(0.6rem, 1.5vw, 0.875rem); }
        .btn-round { border-radius: clamp(0.6rem, 1.5vw, 0.875rem); }
        .msg-mt { margin-top: clamp(0.75rem, 2vw, 1rem); }
        .msg-text { font-size: clamp(0.7rem, 1.3vw, 0.875rem); }
    </style>
</head>
<body class="font-sans min-h-screen flex items-center justify-center p-[clamp(0.75rem,3vw,1.5rem)]">
    <div class="w-full max-w-md glass card-padding card-round shadow-[0_clamp(1rem,4vw,2rem)_clamp(1.5rem,6vw,3rem)_rgba(0,0,0,0.4)]">
        <p class="text-teal-400 eyebrow-text font-black uppercase tracking-widest">First login</p>
        <h1 class="header-title font-black text-white mt-eyebrow">Change your password</h1>
        <p class="text-slate-400 header-subtitle mt-subtitle">Your temporary password must be replaced before you continue. New passwords must be at least 12 characters with uppercase, lowercase, number, and a special character.</p>
        <form id="form" class="form-space mt-form">
            <input id="current" type="password" required class="w-full bg-white/5 border border-white/10 input-round input-px input-py text-white placeholder-gray-600 outline-none focus:ring-2 focus:ring-blue-500 transition" placeholder="Temporary password">
            <input id="new" type="password" minlength="12" required class="w-full bg-white/5 border border-white/10 input-round input-px input-py text-white placeholder-gray-600 outline-none focus:ring-2 focus:ring-blue-500 transition" placeholder="New password">
            <input id="confirm" type="password" minlength="12" required class="w-full bg-white/5 border border-white/10 input-round input-px input-py text-white placeholder-gray-600 outline-none focus:ring-2 focus:ring-blue-500 transition" placeholder="Confirm new password">
            <button class="w-full bg-blue-600 text-white btn-py btn-round font-black btn-text hover:bg-blue-700 transition shadow-2xl shadow-blue-600/30">Change password</button>
        </form>
        <p id="msg" class="msg-mt msg-text"></p>
    </div>
    <script src="/static/js/main.js"></script>
    <script>
        document.getElementById('form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const n = document.getElementById('new').value;
            const c = document.getElementById('confirm').value;
            const m = document.getElementById('msg');
            const validation = typeof validatePasswordStrength === 'function'
                ? validatePasswordStrength(n)
                : { valid: n.length >= 8, errors: ['New password is too weak.'] };
            if (!validation.valid) {
                m.textContent = validation.errors[0] || 'New password does not meet security requirements.';
                m.className = 'msg-mt msg-text text-red-400 font-bold';
                return;
            }
            if (n !== c) {
                m.textContent = 'Passwords do not match.';
                m.className = 'msg-mt msg-text text-red-400 font-bold';
                return;
            }
            m.textContent = 'Updating password...';
            m.className = 'msg-mt msg-text text-blue-400 font-bold';
            const r = await fetch('/api/auth/change-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    current_password: document.getElementById('current').value,
                    new_password: n
                })
            });
            const p = await r.json();
            if (!p.success) {
                m.textContent = p.error || p.detail || 'Unable to change password.';
                m.className = 'msg-mt msg-text text-red-400 font-bold';
                return;
            }
            window.location.href = p.data.redirect;
        });
    </script>
</body>
</html>
