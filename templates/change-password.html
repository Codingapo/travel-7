<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Change Password - TravelIntel AI</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="min-h-screen bg-slate-950 text-white flex items-center justify-center p-6"><div class="w-full max-w-md bg-white/5 border border-white/10 rounded-3xl p-8 shadow-2xl"><p class="text-teal-400 text-xs font-black uppercase tracking-widest">First login</p><h1 class="text-3xl font-black mt-2">Change your password</h1><p class="text-slate-400 mt-3">Your temporary password must be replaced before you continue.</p><form id="form" class="space-y-4 mt-7"><input id="current" type="password" required class="w-full bg-white/5 border border-white/10 rounded-xl p-3" placeholder="Temporary password"><input id="new" type="password" minlength="8" required class="w-full bg-white/5 border border-white/10 rounded-xl p-3" placeholder="New password"><input id="confirm" type="password" minlength="8" required class="w-full bg-white/5 border border-white/10 rounded-xl p-3" placeholder="Confirm new password"><button class="w-full bg-teal-400 text-slate-950 font-black rounded-xl p-3">Change password</button></form><p id="msg" class="mt-4 text-sm"></p></div><script>document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const n=document.getElementById('new').value,c=document.getElementById('confirm').value,m=document.getElementById('msg');if(n!==c){m.textContent='Passwords do not match.';m.className='mt-4 text-sm text-red-400';return;}const r=await fetch('/api/auth/change-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({current_password:document.getElementById('current').value,new_password:n})});const p=await r.json();if(!p.success){m.textContent=p.error||'Unable to change password.';m.className='mt-4 text-sm text-red-400';return;}window.location.href=p.data.redirect;});</script></body></html>
