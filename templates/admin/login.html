<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - TravelIntel AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0f172a;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        html { font-size: clamp(14px, 1vw, 18px); }
        .logo-box { width: clamp(3rem, 7vw, 4rem); height: clamp(3rem, 7vw, 4rem); }
        .logo-box i { font-size: clamp(1.1rem, 2.5vw, 1.5rem); }
        .card-padding { padding: clamp(1.5rem, 6vw, 3rem); }
        .card-round { border-radius: clamp(1.5rem, 4vw, 2.5rem); }
        .header-title { font-size: clamp(1.25rem, 3.5vw, 2rem); }
        .header-subtitle { font-size: clamp(0.9rem, 1.8vw, 1.5rem); }
        .mb-logo { margin-bottom: clamp(1.5rem, 5vw, 2.5rem); }
        .mb-header { margin-bottom: clamp(1.25rem, 4vw, 2rem); }
        .label-text { font-size: clamp(0.7rem, 1.3vw, 0.875rem); }
        .input-icon-size { font-size: clamp(0.9rem, 1.6vw, 1.1rem); }
        .input-px { padding-left: clamp(1rem, 2vw, 1.25rem); padding-right: clamp(1rem, 2vw, 1.25rem); }
        .input-py { padding-top: clamp(0.75rem, 1.5vw, 0.875rem); padding-bottom: clamp(0.75rem, 1.5vw, 0.875rem); }
        .btn-py { padding-top: clamp(0.85rem, 1.8vw, 1rem); padding-bottom: clamp(0.85rem, 1.8vw, 1rem); }
        .btn-text { font-size: clamp(0.875rem, 1.5vw, 1.125rem); }
        .helper-text { font-size: clamp(0.65rem, 1.2vw, 0.875rem); }
        .input-group-mb { margin-bottom: clamp(0.75rem, 2vw, 1.5rem); }
        .error-mt { margin-top: clamp(0.75rem, 2vw, 1rem); }
        .body-p { padding: clamp(0.75rem, 3vw, 1.5rem); }
        .input-round { border-radius: clamp(0.6rem, 1.5vw, 0.875rem); }
        .btn-round { border-radius: clamp(0.6rem, 1.5vw, 0.875rem); }
        .logo-round { border-radius: clamp(0.6rem, 1.5vw, 0.875rem); }
        .link-gap { margin-right: clamp(0.2rem, 0.6vw, 0.3rem); }
        .mt-footer { margin-top: clamp(1.25rem, 3vw, 1.5rem); }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            padding: clamp(0.75rem, 3vw, 1.5rem);
        }
        .hero-gradient {
            background: radial-gradient(circle at top right, #1e3a8a, transparent),
                        radial-gradient(circle at bottom left, #1e1b4b, transparent);
            position: absolute;
            inset: 0;
            z-index: 0;
        }
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
        }
        .login-card {
            width: 100%;
            max-width: 450px;
            padding: clamp(1.5rem, 6vw, 3rem);
            z-index: 10;
            border-radius: clamp(1.5rem, 4vw, 2.5rem);
            box-shadow: 0 clamp(1rem, 3vw, 1.25rem) clamp(1.5rem, 4vw, 2.5rem) rgba(0, 0, 0, 0.2);
        }
        .input-group {
            position: relative;
            margin-bottom: clamp(0.75rem, 2vw, 1.5rem);
        }
        .input-group i {
            position: absolute;
            left: clamp(1rem, 2vw, 1.25rem);
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: clamp(0.9rem, 1.6vw, 1.1rem);
        }
        .input-field {
            width: 100%;
            padding: clamp(0.75rem, 1.5vw, 0.875rem) clamp(1rem, 2vw, 1.25rem) clamp(0.75rem, 1.5vw, 0.875rem) clamp(2.5rem, 5vw, 3rem);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: clamp(0.6rem, 1.5vw, 0.875rem);
            font-size: clamp(0.875rem, 1.5vw, 1rem);
            transition: all 0.3s ease;
            color: #f8fafc;
        }
        .input-field:focus {
            outline: none;
            border-color: #3b82f6;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 0 clamp(0.15rem, 0.4vw, 0.25rem) rgba(59, 130, 246, 0.2);
        }
        .btn-login {
            width: 100%;
            padding-top: clamp(0.85rem, 1.8vw, 1rem);
            padding-bottom: clamp(0.85rem, 1.8vw, 1rem);
            background: #2563eb;
            color: white;
            border-radius: clamp(0.6rem, 1.5vw, 0.875rem);
            font-weight: 700;
            font-size: clamp(0.875rem, 1.5vw, 1.125rem);
            transition: all 0.3s ease;
            margin-top: clamp(0.5rem, 1.2vw, 0.75rem);
            box-shadow: 0 clamp(0.5rem, 1.5vw, 0.75rem) clamp(1rem, 2.5vw, 1.5rem) rgba(37, 99, 235, 0.3);
        }
        .btn-login:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: 0 clamp(0.75rem, 2vw, 1rem) clamp(1.25rem, 3vw, 2rem) rgba(37, 99, 235, 0.4);
        }
    </style>
</head>
<body class="selection:bg-blue-500 selection:text-white p-[clamp(0.75rem,3vw,1.5rem)]">
    <div class="hero-gradient"></div>
    <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')] opacity-10"></div>
    
    <div class="login-card glass">
        <div class="flex items-center justify-center gap-3 mb-logo">
            <div class="logo-box bg-blue-600 logo-round flex items-center justify-center shadow-lg shadow-blue-500/20">
                <i class="fas fa-robot text-white"></i>
            </div>
            <h1 class="header-title font-black tracking-tighter text-white">TravelIntel <span class="text-blue-500">Admin</span></h1>
        </div>

        <h2 class="header-subtitle font-bold text-center text-gray-300 mb-header">Secure Login</h2>

        <form id="adminLoginForm">
            <div class="input-group">
                <i class="far fa-user"></i>
                <input type="text" id="username" class="input-field input-round" placeholder="Username or admin email" required>
            </div>
            
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="password" class="input-field input-round" placeholder="Password" required>
            </div>

<button type="submit" class="btn-login btn-round btn-py btn-text">Access Dashboard</button>
        </form>

        <div class="mt-footer text-center flex items-center justify-center gap-4 flex-wrap">
            <a href="/admin/forgot-password" class="text-blue-400 hover:text-blue-300 font-bold helper-text transition">
                <i class="fas fa-key mr-[clamp(0.2rem,0.6vw,0.3rem)]"></i> Forgot password?
            </a>
        </div>
        
        <div id="errorMessage" class="error-mt p-[clamp(0.6rem,1.8vw,1rem)] rounded-[clamp(0.4rem,1vw,0.6rem)] bg-red-500/10 border border-red-500/20 text-red-400 text-center helper-text hidden font-medium"></div>
    </div>

    <script src="/static/js/main.js"></script>
    <script>
        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');
            const submitBtn = document.querySelector('.btn-login');

            submitBtn.textContent = 'Authenticating...';
            submitBtn.disabled = true;

            try {
                const response = await fetch('/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    localStorage.setItem('adminToken', data.token);
                    window.location.href = '/dashboard';
                } else {
                    errorDiv.textContent = data.error || 'Invalid credentials';
                    errorDiv.classList.remove('hidden');
                    submitBtn.textContent = 'Access Dashboard';
                    submitBtn.disabled = false;
                }
            } catch (err) {
                errorDiv.textContent = 'An error occurred. Please try again.';
                errorDiv.classList.remove('hidden');
                submitBtn.textContent = 'Access Dashboard';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
