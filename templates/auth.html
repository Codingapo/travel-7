<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Sign Up - TravelIntel AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0f172a;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
        }
        body {
            background-color: var(--bg-dark);
            color: #f8fafc;
            background-image: radial-gradient(circle at top right, rgba(37, 99, 235, 0.05), transparent),
                              radial-gradient(circle at bottom left, rgba(29, 78, 216, 0.05), transparent);
        }
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
        }
    </style>
</head>
<body class="h-screen flex items-center justify-center p-4">
    <div class="glass p-8 md:p-12 rounded-[2.5rem] w-full max-w-lg shadow-2xl relative overflow-hidden">
        <div class="absolute top-0 right-0 w-32 h-32 bg-blue-600/10 blur-3xl -mr-16 -mt-16"></div>
        
        <div class="text-center mb-10 relative z-10">
            <div class="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-lg shadow-blue-600/20">
                <i class="fas fa-robot text-2xl text-white"></i>
            </div>
            <h1 class="text-3xl font-black text-white mb-2">TravelIntel <span class="text-blue-500">AI</span></h1>
            <p class="text-gray-400" id="auth-title">Welcome back! Please login.</p>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="space-y-6 relative z-10">
            <div>
                <label class="block text-sm font-bold text-gray-400 mb-2 ml-1">Email Address</label>
                <input type="email" id="login-email" class="w-full px-5 py-4 bg-white/5 border border-white/10 rounded-2xl focus:ring-2 focus:ring-blue-500 focus:border-transparent transition outline-none text-white placeholder-gray-600" placeholder="e.g., explorer@dalani.com" required>
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-400 mb-2 ml-1">Password</label>
                <input type="password" id="login-password" class="w-full px-5 py-4 bg-white/5 border border-white/10 rounded-2xl focus:ring-2 focus:ring-blue-500 focus:border-transparent transition outline-none text-white placeholder-gray-600" placeholder="••••••••" required>
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-black hover:bg-blue-700 transition shadow-xl shadow-blue-600/20">Sign In</button>
            <p class="text-right text-sm">
                <a href="forgot-password.html" class="text-blue-400 hover:underline">Forgot password?</a>
            </p>
            <p class="text-center text-sm text-gray-400">
                New to TravelIntel? <a href="#" onclick="toggleAuth()" class="text-blue-500 font-bold hover:underline">Create Account</a>
            </p>
        </form>

        <!-- Signup Form (Hidden by default) -->
        <form id="signup-form" class="space-y-6 hidden relative z-10">
            <div>
                <label class="block text-sm font-bold text-gray-400 mb-2 ml-1">Email Address</label>
                <input type="email" id="signup-email" class="w-full px-5 py-4 bg-white/5 border border-white/10 rounded-2xl focus:ring-2 focus:ring-blue-500 focus:border-transparent transition outline-none text-white placeholder-gray-600" placeholder="Choose an email" required>
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-400 mb-2 ml-1">Password</label>
                <input type="password" id="signup-password" class="w-full px-5 py-4 bg-white/5 border border-white/10 rounded-2xl focus:ring-2 focus:ring-blue-500 focus:border-transparent transition outline-none text-white placeholder-gray-600" placeholder="Create a password" required>
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-400 mb-2 ml-1">Confirm Password</label>
                <input type="password" id="signup-confirm" class="w-full px-5 py-4 bg-white/5 border border-white/10 rounded-2xl focus:ring-2 focus:ring-blue-500 focus:border-transparent transition outline-none text-white placeholder-gray-600" placeholder="Confirm password" required>
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-black hover:bg-blue-700 transition shadow-xl shadow-blue-600/20">Register Now</button>
            <p class="text-center text-sm text-gray-400">
                Already a member? <a href="#" onclick="toggleAuth()" class="text-blue-500 font-bold hover:underline">Sign In</a>
            </p>
        </form>
        
        <div id="auth-error" class="mt-6 p-4 bg-red-500/10 border border-red-500/20 rounded-xl text-center text-red-400 text-sm hidden"></div>
        <div id="auth-success" class="mt-6 p-4 bg-green-500/10 border border-green-500/20 rounded-xl text-center text-green-400 text-sm hidden"></div>
    </div>
<form id="otp-form" class="space-y-6 hidden relative z-10">

    <div>
        <label class="block text-sm font-bold text-gray-400 mb-2">
            Verification Code
        </label>

        <input
            id="otp-code"
            type="text"
            maxlength="6"
            class="w-full px-5 py-4 bg-white/5 border border-white/10 rounded-2xl text-white"
            placeholder="Enter 6 digit code"
            required
        >
    </div>


    <button
        type="submit"
        class="w-full bg-blue-600 text-white py-4 rounded-2xl font-black">
        Verify Account
    </button>

</form>
    <script src="/static/js/auth.js"></script>
</body>
</html>
