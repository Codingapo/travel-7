<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - TravelIntel AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0f172a;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
        }
        body {
            background-color: var(--bg-dark);
            color: #f8fafc;
            background-image: radial-gradient(circle at top right, rgba(37, 99, 235, 0.05), transparent),
                              radial-gradient(circle at bottom left, rgba(29, 78, 216, 0.05), transparent);
        }
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
        }
    </style>
</head>
<body class="font-sans min-h-screen flex items-center justify-center p-4">
    <div class="glass max-w-md w-full p-10 rounded-[2.5rem] shadow-2xl">
        <div class="text-center mb-10">
            <div class="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-xl shadow-blue-600/20">
                <i class="fas fa-key text-2xl text-white"></i>
            </div>
            <h1 class="text-3xl font-black text-white">Reset Password</h1>
            <p class="text-gray-400 mt-2">Follow the steps to regain access.</p>
        </div>

        <!-- Step 1: Request OTP -->
        <form id="request-form" class="space-y-6">
            <div>
                <label class="block text-sm font-bold text-gray-400 mb-2 ml-1">Email Address</label>
                <input type="email" id="email" class="w-full px-5 py-4 bg-white/5 border border-white/10 rounded-2xl focus:ring-2 focus:ring-blue-500 transition outline-none text-white" placeholder="your@email.com" required>
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-black text-lg hover:bg-blue-700 transition shadow-2xl shadow-blue-600/30">
                Send OTP
            </button>
        </form>

        <!-- Step 2: Verify & Reset -->
        <form id="reset-form" class="space-y-6 hidden">
            <p class="text-center text-sm text-teal-400 font-bold mb-4">OTP sent!</p>
            <div>
                <label class="block text-sm font-bold text-gray-400 mb-2 ml-1">3-Digit OTP</label>
                <input type="text" id="otp" maxlength="3" class="w-full px-5 py-4 bg-white/5 border border-white/10 rounded-2xl focus:ring-2 focus:ring-blue-500 transition outline-none text-white text-center text-2xl tracking-[1em]" placeholder="000" required>
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-400 mb-2 ml-1">New Password</label>
                <input type="password" id="password" class="w-full px-5 py-4 bg-white/5 border border-white/10 rounded-2xl focus:ring-2 focus:ring-blue-500 transition outline-none text-white" placeholder="••••••••" required>
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-400 mb-2 ml-1">Confirm New Password</label>
                <input type="password" id="confirm-password" class="w-full px-5 py-4 bg-white/5 border border-white/10 rounded-2xl focus:ring-2 focus:ring-blue-500 transition outline-none text-white" placeholder="••••••••" required>
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-black text-lg hover:bg-blue-700 transition shadow-2xl shadow-blue-600/30">
                Update Password
            </button>
        </form>

        <div id="msg" class="mt-6 text-center hidden"></div>

        <div class="mt-10 text-center">
            <a href="auth.html" class="text-gray-400 hover:text-white transition font-bold text-sm">
                <i class="fas fa-arrow-left mr-2"></i> Back to Sign In
            </a>
        </div>
    </div>

    <script>
        const requestForm = document.getElementById('request-form');
        const resetForm = document.getElementById('reset-form');
        const msg = document.getElementById('msg');
        let currentEmail = '';

        requestForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            currentEmail = document.getElementById('email').value;
            
            try {
                const res = await fetch('/api/auth/forgot-password/request', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: currentEmail, password: '' })
                });
                const data = await res.json();
                if (data.success) {
                    requestForm.classList.add('hidden');
                    resetForm.classList.remove('hidden');
                    console.log('OTP for prototype:', data.data.otp);
                } else {
                    msg.textContent = data.error || 'Account not found.';
                    msg.className = 'mt-6 text-center text-red-400 font-bold';
                    msg.classList.remove('hidden');
                }
            } catch (err) {
                msg.textContent = 'Connection error.';
                msg.classList.remove('hidden');
            }
        });

        resetForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm-password').value;
            const otp = document.getElementById('otp').value;

            if (password !== confirm) {
                alert('Passwords do not match.');
                return;
            }

            try {
                const res = await fetch('/api/auth/forgot-password/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: currentEmail, password, otp })
                });
                const data = await res.json();
                if (data.success) {
                    msg.textContent = 'Password reset successfully!';
                    msg.className = 'mt-6 text-center text-green-400 font-bold';
                    msg.classList.remove('hidden');
                    setTimeout(() => window.location.href = 'auth.html', 2000);
                } else {
                    msg.textContent = data.error || 'Invalid OTP.';
                    msg.className = 'mt-6 text-center text-red-400 font-bold';
                    msg.classList.remove('hidden');
                }
            } catch (err) {
                msg.textContent = 'Update failed.';
                msg.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
