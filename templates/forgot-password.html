<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - TravelIntel AI</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #0f172a;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        body {
            background-color: var(--bg-dark);
            color: #f8fafc;
            background-image:
                radial-gradient(
                    circle at top right,
                    rgba(37, 99, 235, 0.05),
                    transparent
                ),
                radial-gradient(
                    circle at bottom left,
                    rgba(29, 78, 216, 0.05),
                    transparent
                );
        }

        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
        }
    </style>
</head>

<body class="font-sans min-h-screen flex items-center justify-center p-4">

    <div class="glass max-w-md w-full p-10 rounded-[2.5rem] shadow-2xl">

        <!-- Header -->
        <div class="text-center mb-10">

            <div class="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-xl shadow-blue-600/20">
                <i class="fas fa-key text-2xl text-white"></i>
            </div>

            <h1 class="text-3xl font-black text-white">
                Reset Password
            </h1>

            <p class="text-gray-400 mt-2">
                We'll send a verification code to your email.
            </p>

        </div>


        <!-- Step 1: Request OTP -->
        <form id="request-form" class="space-y-6">

            <div>
                <label class="block text-sm font-bold text-gray-400 mb-2 ml-1">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    class="w-full px-5 py-4 bg-white/5 border border-white/10 rounded-2xl focus:ring-2 focus:ring-blue-500 transition outline-none text-white placeholder-gray-600"
                    placeholder="your@email.com"
                    required
                >
            </div>

            <button
                type="submit"
                id="send-otp-btn"
                class="w-full bg-blue-600 text-white py-4 rounded-2xl font-black text-lg hover:bg-blue-700 transition shadow-2xl shadow-blue-600/30"
            >
                Send Verification Code
            </button>

        </form>


        <!-- Step 2: Verify OTP and Reset Password -->
        <form id="reset-form" class="space-y-6 hidden">

            <div class="text-center mb-6">

                <p class="text-teal-400 font-bold">
                    Verification code sent!
                </p>

                <p class="text-gray-400 text-sm mt-2">
                    Check your email and enter the 6-digit code we sent you.
                </p>

                <p
                    id="email-display"
                    class="text-blue-400 text-sm font-bold mt-2 break-all"
                ></p>

            </div>


            <!-- OTP -->
            <div>
                <label class="block text-sm font-bold text-gray-400 mb-2 ml-1">
                    6-Digit Verification Code
                </label>

                <input
                    type="text"
                    id="otp"
                    maxlength="6"
                    inputmode="numeric"
                    autocomplete="one-time-code"
                    pattern="[0-9]{6}"
                    class="w-full px-5 py-4 bg-white/5 border border-white/10 rounded-2xl focus:ring-2 focus:ring-blue-500 transition outline-none text-white text-center text-2xl tracking-[0.5em]"
                    placeholder="000000"
                    required
                >
            </div>


            <!-- New Password -->
            <div>
                <label class="block text-sm font-bold text-gray-400 mb-2 ml-1">
                    New Password
                </label>

                <input
                    type="password"
                    id="password"
                    minlength="6"
                    class="w-full px-5 py-4 bg-white/5 border border-white/10 rounded-2xl focus:ring-2 focus:ring-blue-500 transition outline-none text-white placeholder-gray-600"
                    placeholder="Enter new password"
                    required
                >
            </div>


            <!-- Confirm Password -->
            <div>
                <label class="block text-sm font-bold text-gray-400 mb-2 ml-1">
                    Confirm New Password
                </label>

                <input
                    type="password"
                    id="confirm-password"
                    minlength="6"
                    class="w-full px-5 py-4 bg-white/5 border border-white/10 rounded-2xl focus:ring-2 focus:ring-blue-500 transition outline-none text-white placeholder-gray-600"
                    placeholder="Confirm new password"
                    required
                >
            </div>


            <button
                type="submit"
                id="reset-password-btn"
                class="w-full bg-blue-600 text-white py-4 rounded-2xl font-black text-lg hover:bg-blue-700 transition shadow-2xl shadow-blue-600/30"
            >
                Update Password
            </button>


            <!-- Resend OTP -->
            <button
                type="button"
                id="resend-btn"
                class="w-full text-blue-400 hover:text-blue-300 font-bold text-sm transition"
            >
                Didn't receive the code? Send again
            </button>

        </form>


        <!-- Messages -->
        <div
            id="msg"
            class="mt-6 text-center hidden"
        ></div>


        <!-- Back -->
        <div class="mt-10 text-center">

            <a
                href="auth.html"
                class="text-gray-400 hover:text-white transition font-bold text-sm"
            >
                <i class="fas fa-arrow-left mr-2"></i>
                Back to Sign In
            </a>

        </div>

    </div>


<script>

    const requestForm = document.getElementById('request-form');
    const resetForm = document.getElementById('reset-form');

    const emailInput = document.getElementById('email');
    const otpInput = document.getElementById('otp');

    const passwordInput = document.getElementById('password');
    const confirmPasswordInput = document.getElementById('confirm-password');

    const msg = document.getElementById('msg');

    const sendOtpBtn = document.getElementById('send-otp-btn');
    const resetPasswordBtn = document.getElementById('reset-password-btn');

    const resendBtn = document.getElementById('resend-btn');

    const emailDisplay = document.getElementById('email-display');

    let currentEmail = '';


    // --------------------------------------------------
    // Show message
    // --------------------------------------------------

    function showMessage(type, message) {

        msg.textContent = message;

        msg.classList.remove(
            'hidden',
            'text-red-400',
            'text-green-400',
            'text-blue-400'
        );

        if (type === 'success') {
            msg.classList.add('text-green-400');
        }

        else if (type === 'error') {
            msg.classList.add('text-red-400');
        }

        else {
            msg.classList.add('text-blue-400');
        }
    }


    // --------------------------------------------------
    // Request password reset OTP
    // --------------------------------------------------

    async function requestOtp() {

        const email = emailInput.value.trim().toLowerCase();

        if (!email) {
            showMessage('error', 'Please enter your email address.');
            return false;
        }


        sendOtpBtn.disabled = true;
        sendOtpBtn.textContent = 'Sending...';

        try {

            const response = await fetch(
                '/api/auth/forgot-password/request',
                {
                    method: 'POST',

                    headers: {
                        'Content-Type': 'application/json'
                    },

                    body: JSON.stringify({
                        email: email,
                        password: ''
                    })
                }
            );


            const data = await response.json();


            if (!response.ok || !data.success) {

                showMessage(
                    'error',
                    data.error || 'Unable to send verification code.'
                );

                return false;
            }


            // Save normalized email
            currentEmail = email;

            emailDisplay.textContent = currentEmail;


            // Hide request form
            requestForm.classList.add('hidden');


            // Show OTP form
            resetForm.classList.remove('hidden');


            // IMPORTANT:
            // We do NOT read an OTP from the API response.
            // The OTP is sent to the user's email through Resend.

            showMessage(
                'success',
                'A verification code has been sent to your email.'
            );


            otpInput.focus();

            return true;

        } catch (error) {

            console.error('OTP request error:', error);

            showMessage(
                'error',
                'Unable to connect to the server. Please try again.'
            );

            return false;

        } finally {

            sendOtpBtn.disabled = false;
            sendOtpBtn.textContent = 'Send Verification Code';

        }
    }


    // --------------------------------------------------
    // Send OTP form
    // --------------------------------------------------

    requestForm.addEventListener(
        'submit',
        async (e) => {

            e.preventDefault();

            await requestOtp();

        }
    );


    // --------------------------------------------------
    // Verify OTP and reset password
    // --------------------------------------------------

    resetForm.addEventListener(
        'submit',
        async (e) => {

            e.preventDefault();


            const otp = otpInput.value.trim();

            const password = passwordInput.value;

            const confirmPassword =
                confirmPasswordInput.value;


            // Validate OTP
            if (!/^\d{6}$/.test(otp)) {

                showMessage(
                    'error',
                    'Please enter the 6-digit verification code from your email.'
                );

                otpInput.focus();

                return;
            }


            // Validate password
            if (password.length < 6) {

                showMessage(
                    'error',
                    'Password must be at least 6 characters.'
                );

                passwordInput.focus();

                return;
            }


            // Confirm password
            if (password !== confirmPassword) {

                showMessage(
                    'error',
                    'Passwords do not match.'
                );

                confirmPasswordInput.focus();

                return;
            }


            resetPasswordBtn.disabled = true;
            resetPasswordBtn.textContent = 'Updating Password...';


            try {

                const response = await fetch(
                    '/api/auth/forgot-password/verify',
                    {
                        method: 'POST',

                        headers: {
                            'Content-Type': 'application/json'
                        },

                        body: JSON.stringify({
                            email: currentEmail,
                            password: password,
                            otp: otp
                        })
                    }
                );


                const data = await response.json();


                if (!response.ok || !data.success) {

                    showMessage(
                        'error',
                        data.error || 'Invalid or expired verification code.'
                    );

                    return;
                }


                showMessage(
                    'success',
                    'Password reset successfully! Redirecting to sign in...'
                );


                // Clear sensitive fields
                otpInput.value = '';
                passwordInput.value = '';
                confirmPasswordInput.value = '';


                setTimeout(
                    () => {
                        window.location.href = 'auth.html';
                    },
                    2000
                );


            } catch (error) {

                console.error(
                    'Password reset error:',
                    error
                );

                showMessage(
                    'error',
                    'Unable to reset your password. Please try again.'
                );

            } finally {

                resetPasswordBtn.disabled = false;

                resetPasswordBtn.textContent =
                    'Update Password';

            }

        }
    );


    // --------------------------------------------------
    // Resend OTP
    // --------------------------------------------------

    resendBtn.addEventListener(
        'click',
        async () => {

            if (!currentEmail) {
                return;
            }


            emailInput.value = currentEmail;


            resendBtn.disabled = true;

            resendBtn.textContent =
                'Sending new code...';


            try {

                const response = await fetch(
                    '/api/auth/forgot-password/request',
                    {
                        method: 'POST',

                        headers: {
                            'Content-Type': 'application/json'
                        },

                        body: JSON.stringify({
                            email: currentEmail,
                            password: ''
                        })
                    }
                );


                const data = await response.json();


                if (!response.ok || !data.success) {

                    showMessage(
                        'error',
                        data.error || 'Unable to resend verification code.'
                    );

                    return;
                }


                // The new OTP is sent by Resend.
                // It is NOT returned to the frontend.

                otpInput.value = '';

                otpInput.focus();


                showMessage(
                    'success',
                    'A new verification code has been sent to your email.'
                );


            } catch (error) {

                console.error(
                    'Resend OTP error:',
                    error
                );

                showMessage(
                    'error',
                    'Unable to resend the verification code.'
                );

            } finally {

                resendBtn.disabled = false;

                resendBtn.textContent =
                    "Didn't receive the code? Send again";

            }

        }
    );

</script>

</body>
</html>
