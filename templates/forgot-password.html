<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - TravelIntel AI</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #0f172a;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
        }
        html { font-size: clamp(14px, 1vw, 18px); }
        body {
            background-color: var(--bg-dark);
            color: #f8fafc;
            background-image:
                radial-gradient(
                    circle at top right,
                    rgba(37, 99, 235, 0.05),
                    transparent
                ),
                radial-gradient(
                    circle at bottom left,
                    rgba(29, 78, 216, 0.05),
                    transparent
                );
        }
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
        }
        .logo-box {
            width: clamp(3rem, 7vw, 4rem);
            height: clamp(3rem, 7vw, 4rem);
        }
        .logo-box i { font-size: clamp(1.1rem, 2.5vw, 1.5rem); }
        .card-padding { padding: clamp(1.5rem, 5vw, 2.5rem); }
        .card-round { border-radius: clamp(1.5rem, 4vw, 2.5rem); }
        .header-title { font-size: clamp(1.5rem, 4vw, 2rem); }
        .header-subtitle { font-size: clamp(0.75rem, 1.5vw, 0.95rem); }
        .mb-header { margin-bottom: clamp(2rem, 6vw, 2.5rem); }
        .mb-logo { margin-bottom: clamp(1.25rem, 4vw, 1.5rem); }
        .label-text { font-size: clamp(0.7rem, 1.3vw, 0.875rem); }
        .label-mb { margin-bottom: clamp(0.35rem, 1vw, 0.5rem); }
        .input-px { padding-left: clamp(1rem, 2.5vw, 1.25rem); padding-right: clamp(1rem, 2.5vw, 1.25rem); }
        .input-py { padding-top: clamp(0.85rem, 1.8vw, 1rem); padding-bottom: clamp(0.85rem, 1.8vw, 1rem); }
        .btn-py { padding-top: clamp(0.85rem, 1.8vw, 1rem); padding-bottom: clamp(0.85rem, 1.8vw, 1rem); }
        .btn-text { font-size: clamp(0.875rem, 1.5vw, 1.125rem); }
        .form-space { space-y: clamp(1rem, 2.5vw, 1.5rem); }
        .otp-text { font-size: clamp(1.1rem, 3vw, 1.75rem); }
        .helper-text { font-size: clamp(0.65rem, 1.2vw, 0.875rem); }
        .mt-footer { margin-top: clamp(1.5rem, 5vw, 2.5rem); }
        .msg-mt { margin-top: clamp(1rem, 3vw, 1.5rem); }
        .timer-gap { gap: clamp(0.35rem, 1vw, 0.5rem); }
        .timer-mt { margin-top: clamp(0.5rem, 1.5vw, 0.75rem); }
    </style>
</head>

<body class="font-sans min-h-screen flex items-center justify-center p-[clamp(0.75rem,3vw,1.5rem)]">

    <div class="glass max-w-md w-full card-padding card-round shadow-[0_clamp(1rem,4vw,2rem)_clamp(1.5rem,6vw,3rem)_rgba(0,0,0,0.4)]">

        <!-- Header -->
        <div class="text-center mb-header">

            <div class="logo-box bg-blue-600 rounded-[clamp(0.75rem,2vw,1.25rem)] flex items-center justify-center mx-auto mb-logo shadow-xl shadow-blue-600/20">
                <i class="fas fa-key text-white"></i>
            </div>

            <h1 class="header-title font-black text-white">
                Reset Password
            </h1>

            <p class="text-gray-400 mt-[clamp(0.35rem,1vw,0.5rem)] header-subtitle">
                We'll send a verification code to your email.
            </p>

        </div>


        <!-- Step 1: Request OTP -->
        <form id="request-form" class="form-space">

            <div>
                <label class="block label-text font-bold text-gray-400 label-mb ml-1">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    class="w-full input-px input-py bg-white/5 border border-white/10 rounded-[clamp(0.75rem,2vw,1.25rem)] focus:ring-2 focus:ring-blue-500 transition outline-none text-white placeholder-gray-600"
                    placeholder="your@email.com"
                    required
                >
            </div>

            <button
                type="submit"
                id="send-otp-btn"
                class="w-full bg-blue-600 text-white btn-py rounded-[clamp(0.75rem,2vw,1.25rem)] font-black btn-text hover:bg-blue-700 transition shadow-2xl shadow-blue-600/30"
            >
                Send Verification Code
            </button>

        </form>


        <!-- Step 2: Verify OTP and Reset Password -->
        <form id="reset-form" class="form-space hidden">

            <div class="text-center mb-[clamp(1rem,3vw,1.5rem)]">

                <p class="text-teal-400 font-bold helper-text">
                    Verification code sent!
                </p>

                <p class="text-gray-400 helper-text mt-[clamp(0.35rem,1vw,0.5rem)]">
                    Check your email and enter the 6-digit code we sent you.
                </p>

                <p
                    id="email-display"
                    class="text-blue-400 helper-text font-bold mt-[clamp(0.35rem,1vw,0.5rem)] break-all"
                ></p>

            </div>


            <!-- OTP -->
            <div>
                <label class="block label-text font-bold text-gray-400 label-mb ml-1">
                    6-Digit Verification Code
                </label>

                <input
                    type="text"
                    id="otp"
                    maxlength="6"
                    inputmode="numeric"
                    autocomplete="one-time-code"
                    pattern="[0-9]{6}"
                    class="w-full input-px input-py bg-white/5 border border-white/10 rounded-[clamp(0.75rem,2vw,1.25rem)] focus:ring-2 focus:ring-blue-500 transition outline-none text-white text-center otp-text tracking-[0.5em]"
                    placeholder="000000"
                    required
                >
                <div id="otp-timer" class="timer-mt flex items-center justify-center timer-gap helper-text font-bold">
                    <span id="timer-icon" class="text-blue-400"><i class="fas fa-hourglass-half"></i></span>
                    <span id="timer-text" class="text-gray-300">Resend available in 0:90</span>
                </div>
            </div>


            <!-- New Password -->
            <div>
                <label class="block label-text font-bold text-gray-400 label-mb ml-1">
                    New Password
                </label>

                <input
                    type="password"
                    id="password"
                    minlength="12"
                    class="w-full input-px input-py bg-white/5 border border-white/10 rounded-[clamp(0.75rem,2vw,1.25rem)] focus:ring-2 focus:ring-blue-500 transition outline-none text-white placeholder-gray-600"
                    placeholder="Enter new password"
                    required
                >
            </div>


            <!-- Confirm Password -->
            <div>
                <label class="block label-text font-bold text-gray-400 label-mb ml-1">
                    Confirm New Password
                </label>

                <input
                    type="password"
                    id="confirm-password"
                    minlength="12"
                    class="w-full input-px input-py bg-white/5 border border-white/10 rounded-[clamp(0.75rem,2vw,1.25rem)] focus:ring-2 focus:ring-blue-500 transition outline-none text-white placeholder-gray-600"
                    placeholder="Confirm new password"
                    required
                >
            </div>


            <button
                type="submit"
                id="reset-password-btn"
                class="w-full bg-blue-600 text-white btn-py rounded-[clamp(0.75rem,2vw,1.25rem)] font-black btn-text hover:bg-blue-700 transition shadow-2xl shadow-blue-600/30"
            >
                Update Password
            </button>


            <!-- Resend OTP -->
            <button
                type="button"
                id="resend-btn"
                class="w-full text-blue-400 hover:text-blue-300 font-bold helper-text transition hidden"
            >
                Didn't receive the code? Send again
            </button>

        </form>


        <!-- Messages -->
        <div
            id="msg"
            class="msg-mt text-center hidden helper-text font-bold"
        ></div>


        <!-- Back -->
        <div class="mt-footer text-center">

            <a
                href="/auth/login"
                class="text-gray-400 hover:text-white transition font-bold helper-text"
            >
                <i class="fas fa-arrow-left mr-[clamp(0.35rem,1vw,0.5rem)]"></i>
                Back to Sign In
            </a>

        </div>

    </div>

    <script src="/static/js/main.js"></script>

<script>

    const requestForm = document.getElementById('request-form');
    const resetForm = document.getElementById('reset-form');

    const emailInput = document.getElementById('email');
    const otpInput = document.getElementById('otp');

    const passwordInput = document.getElementById('password');
    const confirmPasswordInput = document.getElementById('confirm-password');

    const msg = document.getElementById('msg');

    const sendOtpBtn = document.getElementById('send-otp-btn');
    const resetPasswordBtn = document.getElementById('reset-password-btn');

    const resendBtn = document.getElementById('resend-btn');

const emailDisplay = document.getElementById('email-display');

    const timerText = document.getElementById('timer-text');
    const timerIcon = document.getElementById('timer-icon');

    let currentEmail = '';
    let countdownTimer = null;
    const RESEND_WAIT_SECONDS = 90;


    // --------------------------------------------------
    // Resend countdown timer
    // --------------------------------------------------

    function startResendCountdown() {
        if (countdownTimer) clearInterval(countdownTimer);
        let remaining = RESEND_WAIT_SECONDS;
        resendBtn.classList.add('hidden');
        timerIcon.innerHTML = '<i class="fas fa-hourglass-half"></i>';
        timerText.textContent = 'Resend available in 0:90';
        countdownTimer = setInterval(() => {
            remaining--;
            if (remaining <= 0) {
                clearInterval(countdownTimer);
                countdownTimer = null;
                timerText.textContent = 'You can now resend a new code.';
                timerIcon.innerHTML = '<i class="fas fa-check-circle"></i>';
                resendBtn.classList.remove('hidden');
            } else {
                const mins = Math.floor(remaining / 60);
                const secs = remaining % 60;
                timerText.textContent = `Resend available in ${mins}:${secs < 10 ? '0' + secs : secs}`;
            }
        }, 1000);
    }


    // --------------------------------------------------
    // Show message
    // --------------------------------------------------

    function showMessage(type, message) {

        msg.textContent = message;

        msg.classList.remove(
            'hidden',
            'text-red-400',
            'text-green-400',
            'text-blue-400'
        );

        if (type === 'success') {
            msg.classList.add('text-green-400');
        }

        else if (type === 'error') {
            msg.classList.add('text-red-400');
        }

        else {
            msg.classList.add('text-blue-400');
        }
    }


    // --------------------------------------------------
    // Request password reset OTP
    // --------------------------------------------------

    async function requestOtp() {

        const email = emailInput.value.trim().toLowerCase();

        if (!email) {
            showMessage('error', 'Please enter your email address.');
            return false;
        }


        sendOtpBtn.disabled = true;
        sendOtpBtn.textContent = 'Sending...';

        try {

            const response = await fetch(
                '/api/auth/forgot-password/request',
                {
                    method: 'POST',

                    headers: {
                        'Content-Type': 'application/json'
                    },

                    body: JSON.stringify({
                        email: email,
                        password: ''
                    })
                }
            );


            const data = await response.json();


            if (!response.ok || !data.success) {

                showMessage(
                    'error',
                    data.error || 'Unable to send verification code.'
                );

                return false;
            }


            // Save normalized email
            currentEmail = email;

            emailDisplay.textContent = currentEmail;


            // Hide request form
            requestForm.classList.add('hidden');


            // Show OTP form
            resetForm.classList.remove('hidden');


            // IMPORTANT:
            // We do NOT read an OTP from the API response.
            // The OTP is sent to the user's email through Resend.

showMessage(
                'success',
                'A verification code has been sent to your email.'
            );


            otpInput.focus();

            startResendCountdown();

            return true;

        } catch (error) {

            console.error('OTP request error:', error);

            showMessage(
                'error',
                'Unable to connect to the server. Please try again.'
            );

            return false;

        } finally {

            sendOtpBtn.disabled = false;
            sendOtpBtn.textContent = 'Send Verification Code';

        }
    }


    // --------------------------------------------------
    // Send OTP form
    // --------------------------------------------------

    requestForm.addEventListener(
        'submit',
        async (e) => {

            e.preventDefault();

            await requestOtp();

        }
    );


    // --------------------------------------------------
    // Verify OTP and reset password
    // --------------------------------------------------

    resetForm.addEventListener(
        'submit',
        async (e) => {

            e.preventDefault();


            const otp = otpInput.value.trim();

            const password = passwordInput.value;

            const confirmPassword =
                confirmPasswordInput.value;


            // Validate OTP
            if (!/^\d{6}$/.test(otp)) {

                showMessage(
                    'error',
                    'Please enter the 6-digit verification code from your email.'
                );

                otpInput.focus();

                return;
            }


            // Validate password
            const emailLocal = currentEmail.includes('@') ? currentEmail.split('@')[0] : currentEmail;
            const pwValidation = typeof validatePasswordStrength === 'function'
                ? validatePasswordStrength(password, [currentEmail, emailLocal])
                : { valid: password.length >= 12, errors: ['Password is too weak.'] };
            if (!pwValidation.valid) {
                showMessage(
                    'error',
                    pwValidation.errors[0] || 'Password does not meet the security requirements.'
                );
                passwordInput.focus();
                return;
            }


            // Confirm password
            if (password !== confirmPassword) {

                showMessage(
                    'error',
                    'Passwords do not match.'
                );

                confirmPasswordInput.focus();

                return;
            }


            resetPasswordBtn.disabled = true;
            resetPasswordBtn.textContent = 'Updating Password...';


            try {

                const response = await fetch(
                    '/api/auth/forgot-password/verify',
                    {
                        method: 'POST',

                        headers: {
                            'Content-Type': 'application/json'
                        },

                        body: JSON.stringify({
                            email: currentEmail,
                            password: password,
                            otp: otp
                        })
                    }
                );


                const data = await response.json();


                if (!response.ok || !data.success) {

                    showMessage(
                        'error',
                        data.error || 'Invalid or expired verification code.'
                    );

                    return;
                }


                showMessage(
                    'success',
                    'Password reset successfully! Redirecting to sign in...'
                );


                // Clear sensitive fields
                otpInput.value = '';
                passwordInput.value = '';
                confirmPasswordInput.value = '';


                setTimeout(
                    () => {
                        window.location.href = '/auth/login';
                    },
                    2000
                );


            } catch (error) {

                console.error(
                    'Password reset error:',
                    error
                );

                showMessage(
                    'error',
                    'Unable to reset your password. Please try again.'
                );

            } finally {

                resetPasswordBtn.disabled = false;

                resetPasswordBtn.textContent =
                    'Update Password';

            }

        }
    );


    // --------------------------------------------------
    // Resend OTP
    // --------------------------------------------------

    resendBtn.addEventListener(
        'click',
        async () => {

            if (!currentEmail) {
                return;
            }


            emailInput.value = currentEmail;


            resendBtn.disabled = true;

            resendBtn.textContent =
                'Sending new code...';


            try {

                const response = await fetch(
                    '/api/auth/forgot-password/request',
                    {
                        method: 'POST',

                        headers: {
                            'Content-Type': 'application/json'
                        },

                        body: JSON.stringify({
                            email: currentEmail,
                            password: ''
                        })
                    }
                );


                const data = await response.json();


                if (!response.ok || !data.success) {

                    showMessage(
                        'error',
                        data.error || 'Unable to resend verification code.'
                    );

                    return;
                }


                // The new OTP is sent by Resend.
                // It is NOT returned to the frontend.

otpInput.value = '';

                otpInput.focus();


                showMessage(
                    'success',
                    'A new verification code has been sent to your email.'
                );

                startResendCountdown();


            } catch (error) {

                console.error(
                    'Resend OTP error:',
                    error
                );

                showMessage(
                    'error',
                    'Unable to resend the verification code.'
                );

            } finally {

                resendBtn.disabled = false;

                resendBtn.textContent =
                    "Didn't receive the code? Send again";

            }

        }
    );

</script>

</body>
</html>
